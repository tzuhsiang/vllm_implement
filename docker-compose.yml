version: '3.8'

services:
  vllm:
    image: vllm/vllm-openai:v0.10.0
    container_name: vllm
    command: ["--model", "/models/gemma-3-4b-it","--served-model-name","gemma-3-4b-it"]
    ports:
      - "9999:8000"
    volumes:
      - ./models/gemma-3-4b-it:/models/gemma-3-4b-it
    environment:
      - TRANSFORMERS_OFFLINE=1
    ipc: host
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
